# Builds the packages of one version in Source/Content/ (or of all versions), publishes them to NuGet.org with Trusted
# Publishing, and creates a GitHub release for each version. It starts only by hand, because a published package
# version cannot be replaced.
#
# NuGet.org needs a Trusted Publishing policy that names this repository and this file name. The NUGET_USER secret
# holds the NuGet.org profile name.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version in Source/Content/ to publish (ex. 2027.2.0), or "all"'
        type: string
        required: true
      suffix:
        description: 'Prerelease suffix (ex. beta.1). Empty publishes a stable version.'
        type: string
        required: false

concurrency:
  group: release

jobs:
  release:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: write
    env:
      # Environment variables, so the inputs are never part of the script text.
      VERSION: ${{ inputs.version }}
      SUFFIX: ${{ inputs.suffix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build NuGet Packages
        shell: pwsh
        run: |
          if ($env:VERSION -eq 'all') {
              ./Tools/Build-Packages.ps1 -Suffix $env:SUFFIX
          }
          else {
              ./Tools/Build-Packages.ps1 -Version $env:VERSION -Suffix $env:SUFFIX
          }

      # The temporary API key is short lived, so this step comes after the build.
      - name: NuGet Login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish To NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        # On Windows, "dotnet nuget push" does not expand a wildcard in a path with "/". PowerShell finds the files.
        run: |
          $packages = @(Get-ChildItem -Path artifacts/packages -Filter *.nupkg)
          if ($packages.Count -eq 0) {
              throw 'artifacts/packages/ holds no package.'
          }

          foreach ($package in $packages) {
              dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
              if ($LASTEXITCODE -ne 0) {
                  throw "The push of $($package.Name) failed."
              }
          }

      - name: Create Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $versions = $env:VERSION -eq 'all' ? @((Get-ChildItem Source/Content -Directory).Name | Sort-Object) : @($env:VERSION)

          # A prerelease never becomes the "Latest" release on GitHub.
          $options = @()
          if ($env:SUFFIX) {
              $options += '--prerelease'
          }

          foreach ($version in $versions) {
              $tag = $env:SUFFIX ? "$version-$env:SUFFIX" : $version

              gh release view $tag *> $null
              if ($LASTEXITCODE -eq 0) {
                  Write-Host "The release $tag exists. Skipped."
                  continue
              }

              $packages = @((Get-ChildItem "artifacts/packages/*.$tag.nupkg").FullName)
              gh release create $tag @packages @options --target $env:GITHUB_SHA --title $tag --generate-notes
              if ($LASTEXITCODE -ne 0) {
                  throw "The release $tag failed."
              }
          }

          # A missing release leaves a nonzero exit code from "gh release view".
          exit 0
