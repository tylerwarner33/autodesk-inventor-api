# Builds the packages of one version in Source/Content/ (or of all versions), publishes them to NuGet.org with Trusted
# Publishing, and creates a GitHub release for each version. It starts only by hand, because a published package
# version cannot be replaced.
#
# NuGet.org needs a Trusted Publishing policy that names this repository and this file name. The NUGET_USER secret
# holds the NuGet.org profile name.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version in Source/Content/ to publish (ex. 2027.2.0), or "all"'
        type: string
        required: true

concurrency:
  group: release

jobs:
  release:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: write
    env:
      # An environment variable, so the input is never part of the script text.
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build NuGet Packages
        shell: pwsh
        run: |
          if ($env:VERSION -eq 'all') {
              ./Tools/Build-Packages.ps1
          }
          else {
              ./Tools/Build-Packages.ps1 -Version $env:VERSION
          }

      # The temporary API key is short lived, so this step comes after the build.
      - name: NuGet Login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish To NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $versions = $env:VERSION -eq 'all' ? @((Get-ChildItem Source/Content -Directory).Name | Sort-Object) : @($env:VERSION)

          foreach ($version in $versions) {
              gh release view $version *> $null
              if ($LASTEXITCODE -eq 0) {
                  Write-Host "The release $version exists. Skipped."
                  continue
              }

              $packages = @((Get-ChildItem "artifacts/packages/*.$version.nupkg").FullName)
              gh release create $version @packages --target $env:GITHUB_SHA --title $version --generate-notes
              if ($LASTEXITCODE -ne 0) {
                  throw "The release $version failed."
              }
          }

          # A missing release leaves a nonzero exit code from "gh release view".
          exit 0
